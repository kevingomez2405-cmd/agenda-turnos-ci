name: CI

# Eventos: cada push a main y cada pull request hacia main.
# workflow_dispatch permite ejecutarlo a mano desde la pestaña Actions.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Permisos mínimos: este flujo solo necesita leer el código.
permissions:
  contents: read

# Si llega un commit nuevo a la misma rama, cancela la ejecución anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Verificar
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Node.js (versión de .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias con el lockfile
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Sintaxis
        run: npm run sintaxis

      - name: Pruebas
        run: npm test

      - name: Build
        run: npm run build

      # always(): el reporte se guarda aunque algún paso falle, para poder diagnosticar.
      - name: Guardar reporte de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-pruebas-${{ github.sha }}
          path: reports/junit.xml
          if-no-files-found: warn
          retention-days: 14

      # Solo se publica el build si todos los pasos anteriores pasaron.
      - name: Guardar build
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
