name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Verificar
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Todos los comandos run se ejecutan dentro de la carpeta del proyecto
    defaults:
      run:
        working-directory: Fuentes_o_Archivos_Editables/proyecto-ci

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Node.js (versión de .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: Fuentes_o_Archivos_Editables/proyecto-ci/.nvmrc
          cache: npm
          cache-dependency-path: Fuentes_o_Archivos_Editables/proyecto-ci/package-lock.json

      - name: Instalar dependencias con el lockfile
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Sintaxis
        run: npm run sintaxis

      - name: Pruebas
        run: npm test

      - name: Build
        run: npm run build

      - name: Guardar reporte de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-pruebas-${{ github.sha }}
          path: Fuentes_o_Archivos_Editables/proyecto-ci/reports/junit.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Guardar build
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.sha }}
          path: Fuentes_o_Archivos_Editables/proyecto-ci/dist/
          if-no-files-found: error
          retention-days: 14
